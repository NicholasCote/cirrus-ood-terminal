# CIRRUS Terminal: the short names that work from Casper and Derecho, where the
# DNS search path includes hpc.ucar.edu. In a pod it does not -- the search
# path is the cluster's -- so without these `ssh derecho` fails to resolve.
# Anything in the user's ~/.ssh/config is read first and wins.
Host derecho
    HostName derecho.hpc.ucar.edu

Host casper
    HostName casper.hpc.ucar.edu
