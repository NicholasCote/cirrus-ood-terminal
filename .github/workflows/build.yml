name: Build and push CIRRUS Terminal image

on:
  workflow_dispatch:
    inputs:
      skip_bump:
        description: "Build and push, but do not pin the tag in submit.yml.erb"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - image/**
      - .github/workflows/build.yml
    branches:
      - main

permissions:
  contents: read

# Two runs at once would race to bump submit.yml.erb; queue them instead.
concurrency:
  group: build-cirrus-terminal
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit the new tag to submit.yml.erb
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      # One place the tag is computed and the full reference assembled; the
      # build, push, pin and summary all read it, so they cannot drift apart.
      - name: Compose the image reference
        id: ref
        run: |
          tag="$(date +'%Y-%m-%d.%H.%M')"
          {
            echo "tag=${tag}"
            echo "image=hub.k8s.ucar.edu/cirrus-ood/opensuse-terminal:${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: registry login
        uses: docker/login-action@v3
        with:
          registry: hub.k8s.ucar.edu
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_SECRET }}

      # The image lives in a subdirectory; OOD reads the app files at the root
      # and ignores image/ entirely.
      - name: Build image
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          docker buildx build --load \
            -t "$IMAGE" \
            -f image/Dockerfile \
            image

      # Runs as an arbitrary uid, the way OnDemand runs the pod, and fails the
      # build before anything is pushed.
      - name: Smoke test
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm --user 54321:54321 -e HOME=/tmp/h -e USER=jdoe \
            -e CIRRUS_TERMINAL_AUTH=none \
            --entrypoint /usr/local/bin/entrypoint.sh "$IMAGE" bootstrap bash -c '
              set -euo pipefail
              for b in ssh scp ssh-agent ssh-add jq curl which git bao-getkey ttyd \
                       cirrus-terminal-gate cirrus-terminal-shell tcsh; do
                command -v "$b" >/dev/null || { echo "MISSING: $b"; exit 1; }
              done
              echo "9fee1714bd7b149dec56798304350642167cae3eb9236aecfbc44fd39dc7bf9e  /usr/local/bin/bao-getkey" \
                | sha256sum -c --quiet
              [ "$(id -un)" = jdoe ] || { echo "uid has no user name"; exit 1; }
              [ "$(cirrus-terminal-shell -c "type -t module")" = function ] \
                || { echo "module is not defined in a login shell"; exit 1; }
              terminal-versions --check
              echo "smoke test OK"
            '
          # A real session: the gate must serve its login page, a signed-in
          # client must reach ttyd, and the session ssh-agent must answer with
          # no identities (exit 1, not 2).
          mkdir -p ood && printf 'password=smoke-test-pw\n' > ood/csenv && chmod -R a+rX ood
          docker run -d --name smoke --user 54321:54321 -p 18080:8080 \
            -v "$PWD/ood:/ood:ro" -e HOME=/tmp/h -e USER=jdoe \
            -e CIRRUS_TERMINAL_PASSWORD_FILE=/ood/csenv -e CIRRUS_TERMINAL_BASE_URL=/ \
            "$IMAGE" terminal
          for _ in $(seq 1 60); do
            curl -fs -o /dev/null http://127.0.0.1:18080/ && break
            sleep 1
          done
          curl -fs http://127.0.0.1:18080/ | grep -q 'Session password' \
            || { docker logs smoke; exit 1; }
          cookie="$(curl -s -D - -o /dev/null --data 'password=smoke-test-pw' \
                      http://127.0.0.1:18080/cirrus-signin \
                    | tr -d '\r' | sed -n 's/^[Ss]et-[Cc]ookie: \([^;]*\).*/\1/p')"
          curl -fs -H "Cookie: ${cookie}" http://127.0.0.1:18080/token | grep -q '"token"' \
            || { echo "ttyd not reachable through the gate"; docker logs smoke; exit 1; }
          python3 image/test/ttyd_session.py --port 18080 --cookie "$cookie" --until __DONE__ \
              <<< "echo __DO''NE__" > /dev/null \
            || { echo "no shell over the websocket"; docker logs smoke; exit 1; }
          docker exec smoke bash -c 'SSH_AUTH_SOCK=/tmp/cirrus-terminal/ssh-agent.sock ssh-add -l; [ $? = 1 ]' \
            || { docker logs smoke; exit 1; }
          docker stop -t 20 smoke >/dev/null
          docker rm smoke >/dev/null
          echo "session smoke test OK"

      - name: Push image to Harbor
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: docker push "$IMAGE"

      # Pins the image just pushed, which passed the smoke test, in
      # submit.yml.erb on main. Only for builds of main. Made on top of the
      # latest main so a push during the build does not reject it. The paths
      # filter above (submit.yml.erb is not in it) prevents a build loop;
      # [skip ci] is belt-and-braces.
      - name: Pin the image in submit.yml.erb
        id: bump
        if: ${{ github.ref == 'refs/heads/main' && !inputs.skip_bump }}
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main
          python3 - "$IMAGE" <<'PY'
          import pathlib, re, sys
          ref = sys.argv[1]
          p = pathlib.Path("submit.yml.erb")
          s = p.read_text()
          new, n = re.subn(r'^(\s*terminal_img\s*=\s*)".*"$',
                           lambda m: f'{m.group(1)}"{ref}"', s, flags=re.M)
          if n != 1:
              sys.exit(f"expected one terminal_img assignment in submit.yml.erb, found {n}")
          p.write_text(new)
          PY
          if git diff --quiet -- submit.yml.erb; then
            echo "terminal_img is already ${IMAGE}; nothing to commit."
            echo "pinned=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submit.yml.erb
          git commit --quiet -m "Pin terminal_img to ${IMAGE##*/} [skip ci]"
          git push --quiet origin HEAD:main
          echo "pinned=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Summarise the pushed image
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          TAG: ${{ steps.ref.outputs.tag }}
          PINNED: ${{ steps.bump.outputs.pinned }}
        run: |
          echo "::notice title=Image pushed::${IMAGE}"
          digest="$(docker image inspect \
              --format '{{ if .RepoDigests }}{{ index .RepoDigests 0 }}{{ end }}' \
              "$IMAGE" 2>/dev/null || true)"
          versions="$(docker run --rm --entrypoint cat "$IMAGE" \
              /opt/cirrus-terminal/versions.txt 2>/dev/null || true)"
          {
            echo "## Image pushed"
            echo
            echo '```'
            echo "${IMAGE}"
            echo '```'
            echo
            case "$PINNED" in
              unchanged) echo "\`submit.yml.erb\` already pinned this image." ;;
              ?*)        echo "Pinned in \`submit.yml.erb\` on main by commit \`${PINNED}\`." ;;
              *)
                echo "**Not pinned** (not a build of main, or skip_bump was set). To use it,"
                echo "set the \`terminal_img\` line near the top of \`submit.yml.erb\`:"
                echo
                echo '```ruby'
                echo "  terminal_img = \"${IMAGE}\""
                echo '```'
                ;;
            esac
            if [ -n "$digest" ]; then
              echo
              echo "Digest: \`${digest#*@}\`"
            fi
            if [ -n "$versions" ]; then
              echo
              echo "| component | version |"
              echo "| --- | --- |"
              printf '%s\n' "$versions" \
                | grep -v '^#' \
                | awk -F'\t' 'NF >= 2 { printf "| %s | `%s` |\n", $1, $2 }'
            fi
            echo
            echo "Tag \`${TAG}\` · commit \`${GITHUB_SHA:0:7}\` · built from \`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
